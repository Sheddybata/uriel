<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="$(refresh-timeout-secs)">
<title>Uriel Network</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#fff;color:#111;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
.wrap{max-width:28rem;margin:0 auto;padding:2rem 1.25rem 6rem}
.mark{height:80px;width:auto}
h1{margin:.75rem 0 0;font-size:2.25rem;line-height:1.05;letter-spacing:-.02em;font-weight:500}
.pill{display:inline-flex;align-items:center;gap:.5rem;margin-top:1rem;padding:.4rem .75rem;border-radius:999px;background:#ecfdf5;color:#047857;font-size:.75rem;font-weight:500}
.dot{width:.5rem;height:.5rem;border-radius:999px;background:#10b981}
.card{margin-top:1.5rem;border:1px solid #e4e4e7;border-radius:1.5rem;padding:1.25rem}
.cap{margin:0;font-size:.6875rem;text-transform:uppercase;letter-spacing:.18em;color:#71717a}
.big{margin:.5rem 0 0;font-size:2rem;font-weight:500;letter-spacing:-.02em}
.row{display:flex;justify-content:space-between;align-items:baseline;margin-top:.9rem;font-size:.875rem;color:#71717a}
.row b{color:#111;font-weight:500}
a.out{display:flex;align-items:center;justify-content:center;margin-top:1.5rem;height:3.5rem;border-radius:1rem;border:1px solid #e4e4e7;color:#111;text-decoration:none;font-size:1rem}
.fab{position:fixed;right:1.25rem;bottom:1.25rem;width:3.5rem;height:3.5rem;border-radius:999px;background:#10b981;color:#fff;display:flex;align-items:center;justify-content:center;text-decoration:none;box-shadow:0 8px 20px rgba(0,0,0,.18)}
</style>
</head>
<body>
<div class="wrap">
  <img class="mark" src="uriel.png" alt="Uriel Network" onerror="this.style.display='none'">
  <h1>You are online.</h1>
  <div class="pill"><span class="dot"></span>PIN $(username)</div>

  <div class="card">
    <p class="cap">Time remaining</p>
    <p class="big">$(if session-time-left)$(session-time-left)$(else)Unlimited$(endif)</p>
    <div class="row"><span>Session uptime</span><b>$(uptime)</b></div>
    <div class="row"><span>Downloaded</span><b>$(bytes-in-nice)</b></div>
    <div class="row"><span>Uploaded</span><b>$(bytes-out-nice)</b></div>
  </div>

  <a class="out" href="$(link-logout)">Log out this device</a>
</div>

<a class="fab" href="https://wa.me/2349031110001?text=Hello%20Uriel%20Network%20support" aria-label="WhatsApp support">
  <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8z"/></svg>
</a>
</body>
</html>
